<style>
  :root{
    --paper:#FBF9F3;
    --paper-edge:#EFEBDD;
    --ink:#2A2521;
    --ink-soft:#6B635A;
    --line:#D9D2C2;
    --grocery:#6B7A4F;
    --meat:#A23B2E;
    --fish:#2E6E8E;
    --toiletries:#7A5C8E;
    --cleaning:#3F7A6B;
    --delivery:#C9622B;
    --other:#8A8578;
    --good:#4C7A4C;
    --warn:#C68A2E;
    --bad:#A23B2E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#E8E4D8;
    font-family:'Segoe UI',Tahoma,Arial,sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:24px 12px 100px;
    min-height:100vh;
  }
  .receipt{
    width:100%;
    max-width:460px;
    background:var(--paper);
    box-shadow:0 12px 30px rgba(0,0,0,.15), 0 2px 6px rgba(0,0,0,.08);
    position:relative;
    padding:28px 20px 24px;
  }
  .receipt::before, .receipt::after{
    content:"";
    position:absolute;
    left:0; right:0;
    height:10px;
    background:
      radial-gradient(circle at 8px 5px, transparent 5px, var(--paper) 5.5px) 0 0/16px 10px repeat-x;
  }
  .receipt::before{ top:-9px; }
  .receipt::after{ bottom:-9px; transform:rotate(180deg); }

  header{ text-align:center; margin-bottom:14px; }
  .logo{
    width:92px;
    height:92px;
    border-radius:22px;
    display:block;
    margin:0 auto 10px;
    box-shadow:0 6px 14px rgba(0,0,0,.2);
  }
  .brand-name{
    font-size:13px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:2px;
  }
  .title{
    font-size:20px;
    font-weight:700;
    letter-spacing:.5px;
  }
  .month-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-top:10px;
  }
  .month-row button{
    width:30px; height:30px;
    border:1px solid var(--ink);
    background:var(--paper);
    border-radius:50%;
    font-size:15px;
    cursor:pointer;
    color:var(--ink);
    line-height:1;
  }
  .month-row button:active{ background:var(--line); }
  .month-label{ font-variant-numeric:tabular-nums; font-weight:600; min-width:120px; text-align:center;}

  .dashed{ border-top:1px dashed var(--line); margin:16px 0; }

  /* ---- cards (dashboard) ---- */
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    margin-bottom:12px;
  }
  .card-label{ font-size:12px; color:var(--ink-soft); margin-bottom:4px; }
  .card-value{ font-family:'Courier New',monospace; font-size:22px; font-weight:700; }
  .card-value.good{ color:var(--good); }
  .card-value.warn{ color:var(--warn); }
  .card-value.bad{ color:var(--bad); }
  .card-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .card-grid .card{ margin-bottom:0; }
  .progress{
    height:8px;
    border-radius:5px;
    background:var(--paper-edge);
    overflow:hidden;
    margin-top:8px;
  }
  .progress > div{ height:100%; border-radius:5px; }

  .quick-actions{ display:flex; gap:10px; margin:4px 0 14px; }
  .quick-actions button{
    flex:1;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:10px;
    padding:10px 6px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .quick-actions button:active{ opacity:.85; }

  .section-title{ font-weight:700; font-size:14px; margin:6px 0 8px; }

  .tx-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 0;
    border-bottom:1px dashed var(--line);
    font-size:13px;
  }
  .tx-row:last-child{ border-bottom:none; }
  .tx-dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .tx-main{ flex:1; min-width:0; }
  .tx-title{ font-weight:600; }
  .tx-sub{ color:var(--ink-soft); font-size:11px; }
  .tx-amount{ font-family:'Courier New',monospace; font-weight:700; white-space:nowrap; }

  .empty-hint{ font-size:12px; color:var(--ink-soft); padding:4px 0 10px; }

  /* ---- category / items (shopping) ---- */
  .category{ margin-bottom:18px; }
  .cat-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .dot{ width:10px; height:10px; border-radius:50%; flex:none; }
  .cat-name{ font-weight:700; font-size:15px; }
  .cat-total{ margin-inline-start:auto; font-family:'Courier New',monospace; font-size:13px; color:var(--ink-soft); }

  .sub-head{
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    margin:8px 0 2px;
    padding-inline-start:2px;
    border-bottom:1px dotted var(--line);
  }

  .item{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:7px 0; font-size:14px; }
  .item.bought .item-name{ text-decoration:line-through; color:var(--ink-soft); }
  .chk{
    width:18px; height:18px;
    border:1.5px solid var(--ink-soft);
    border-radius:4px;
    flex:none;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:var(--paper);
    font-size:12px;
  }
  .item.bought .chk{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
  .item-name{ flex:1; min-width:80px; }
  .item-actions{ display:flex; gap:2px; flex:none; }
  .dup, .del{ background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:15px; padding:2px 5px; flex:none; }
  .dup:hover{ color:var(--good); }
  .del:hover{ color:var(--bad); }
  .item-calc-row{
    flex-basis:100%;
    display:flex;
    align-items:center;
    gap:4px;
    padding-inline-start:26px;
    font-family:'Courier New',monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .item-calc-row input{
    width:42px;
    text-align:center;
    border:1px solid var(--line);
    border-radius:5px;
    padding:2px 3px;
    font-family:inherit;
    font-size:12px;
    color:var(--ink);
    background:#fff;
  }
  .item-calc-row .eq-total{ margin-inline-start:auto; font-weight:700; }

  .add-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .add-row input, .add-row select{
    border:1px solid var(--line);
    background:#fff;
    border-radius:6px;
    padding:6px 8px;
    font-size:13px;
    font-family:inherit;
    color:var(--ink);
  }
  .add-row .name-in{ flex:1 1 100px; min-width:0; }
  .add-row .sub-in{ flex:1 1 100px; min-width:0; }
  .add-row .qty-in{ width:44px; text-align:center; }
  .add-row .price-in{ width:64px; text-align:center; font-family:'Courier New',monospace;}
  .add-row button{
    border:none; background:var(--ink); color:var(--paper); border-radius:6px;
    padding:0 12px; font-size:14px; cursor:pointer;
  }
  .add-row button:active{ opacity:.8; }

  footer{ margin-top:6px; }
  .sum-row{ display:flex; justify-content:space-between; font-size:14px; padding:4px 0; }
  .sum-row.total{ font-weight:700; font-size:16px; padding-top:8px; border-top:1px dashed var(--line); margin-top:6px; }
  .sum-val{ font-family:'Courier New',monospace; }
  .sum-val.good{ color:var(--good); }
  .sum-val.bad{ color:var(--bad); }

  .foot-note{ text-align:center; font-size:11px; color:var(--ink-soft); margin-top:16px; letter-spacing:.5px; }
  .reset-link{
    display:block; text-align:center; margin-top:10px; font-size:12px;
    color:var(--ink-soft); text-decoration:underline; cursor:pointer;
    background:none; border:none; font-family:inherit;
  }

  /* ---- expense form ---- */
  .exp-form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:14px;
  }
  .exp-form .full{ grid-column:1 / -1; }
  .exp-form label{ font-size:11px; color:var(--ink-soft); display:block; margin-bottom:3px; }
  .exp-form input, .exp-form select{
    width:100%;
    border:1px solid var(--line);
    background:#fff;
    border-radius:6px;
    padding:7px 8px;
    font-size:13px;
    font-family:inherit;
    color:var(--ink);
  }
  .exp-form .add-exp-btn{
    grid-column:1 / -1;
    border:none; background:var(--ink); color:var(--paper);
    border-radius:8px; padding:10px; font-size:14px; font-weight:600; cursor:pointer; margin-top:4px;
  }
  .period-tabs{ display:flex; gap:6px; margin-bottom:10px; }
  .period-tabs button{
    flex:1;
    border:1px solid var(--line);
    background:#fff;
    border-radius:8px;
    padding:6px 4px;
    font-size:12px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .period-tabs button.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  .banner{
    border-radius:10px;
    padding:10px 12px;
    font-size:13px;
    margin-bottom:12px;
    font-weight:600;
  }
  .banner.warn{ background:#FBF0D9; color:#7A5A0E; }
  .banner.bad{ background:#F7DEDA; color:#7A2E22; }

  .alloc-row{
    display:flex;
    align-items:center;
    gap:6px;
    padding:7px 0;
    border-bottom:1px dashed var(--line);
    font-size:13px;
  }
  .alloc-row:last-child{ border-bottom:none; }
  .alloc-row .alloc-name{
    flex:1 1 120px;
    min-width:0;
    border:1px solid var(--line);
    border-radius:6px;
    padding:5px 7px;
    font-size:12px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
  }
  .alloc-row .alloc-pct{
    width:52px;
    text-align:center;
    border:1px solid var(--line);
    border-radius:6px;
    padding:5px 3px;
    font-family:'Courier New',monospace;
    font-size:12px;
  }
  .alloc-row .alloc-amt{
    flex:none;
    width:84px;
    text-align:left;
    font-family:'Courier New',monospace;
    font-size:12px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .alloc-total-row{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    font-weight:700;
    padding-top:8px;
    margin-top:4px;
    border-top:1px dashed var(--line);
  }
  .alloc-add-row{ display:flex; gap:6px; margin-top:10px; }
  .alloc-add-row input{
    border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-size:13px; font-family:inherit;
  }
  .alloc-add-row .alloc-add-name{ flex:1; min-width:0; }
  .alloc-add-row .alloc-add-pct{ width:52px; text-align:center; }
  .alloc-add-row button{
    border:none; background:var(--ink); color:var(--paper); border-radius:6px; padding:0 12px; font-size:13px; cursor:pointer;
  }

  .name-card{ display:flex; align-items:center; gap:8px; }
  .name-card input{
    flex:1; border:1px solid var(--line); border-radius:6px; padding:7px 8px; font-size:13px; font-family:inherit;
  }
  .name-card button, .req-add-row button{
    border:none; background:var(--ink); color:var(--paper); border-radius:6px; padding:7px 12px; font-size:13px; cursor:pointer; flex:none;
  }
  .picker-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
  }
  .picker-btn{
    border:1px solid var(--line);
    background:#fff;
    border-radius:10px;
    padding:10px 4px;
    text-align:center;
    cursor:pointer;
    font-family:inherit;
  }
  .picker-btn:active{ background:var(--paper-edge); }
  .picker-btn .p-name{ font-weight:700; font-size:13px; display:block; }
  .picker-btn .p-role{ font-size:10px; color:var(--ink-soft); display:block; margin-top:2px; }
  .req-add-row{ display:flex; gap:6px; margin:4px 0 12px; }
  .req-add-row input{
    flex:1; border:1px solid var(--line); border-radius:6px; padding:8px; font-size:13px; font-family:inherit;
  }
  .refresh-link{
    display:block; text-align:center; font-size:12px; color:var(--ink-soft);
    background:none; border:none; text-decoration:underline; cursor:pointer; margin-bottom:10px; width:100%;
  }
  .req-row{
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:8px;
    background:#fff;
  }
  .req-row.done{ opacity:.55; }
  .req-row.done .req-text{ text-decoration:line-through; }
  .req-top{ display:flex; align-items:flex-start; gap:8px; }
  .req-text{ flex:1; font-size:14px; font-weight:600; }
  .req-meta{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .req-actions{ display:flex; gap:6px; margin-top:8px; }
  .req-actions button{
    border:1px solid var(--ink); background:var(--paper); color:var(--ink);
    border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer;
  }
  .req-actions button.primary{ background:var(--ink); color:var(--paper); }
  .badge{
    font-size:10px; padding:2px 7px; border-radius:10px; font-weight:700; white-space:nowrap;
  }
  .badge.pending{ background:#FBF0D9; color:#7A5A0E; }
  .badge.claimed{ background:#DCE7F5; color:#2E4E7A; }
  .badge.done{ background:#E3EEE0; color:#3F6B3F; }

  .toast{
    position:fixed;
    bottom:88px;
    left:50%;
    transform:translateX(-50%) translateY(12px);
    background:var(--ink);
    color:var(--paper);
    padding:10px 18px;
    border-radius:10px;
    font-size:13px;
    max-width:90%;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:80;
    box-shadow:0 6px 16px rgba(0,0,0,.25);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .copy-box{
    width:100%;
    min-height:110px;
    margin-top:8px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px;
    font-family:'Courier New',monospace;
    font-size:12px;
    direction:rtl;
  }

  .login-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#E8E4D8;
    padding:20px;
  }
  .login-card{
    width:100%;
    max-width:340px;
    background:var(--paper);
    border-radius:16px;
    box-shadow:0 12px 30px rgba(0,0,0,.15);
    padding:28px 22px;
  }
  .login-card label{ font-size:12px; color:var(--ink-soft); display:block; margin:10px 0 4px; }
  .login-card input{
    width:100%;
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 10px;
    font-size:14px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
  }
  .login-card button{
    width:100%;
    margin-top:16px;
    border:none;
    background:var(--ink);
    color:var(--paper);
    border-radius:8px;
    padding:11px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .login-error{
    margin-top:10px;
    font-size:12px;
    color:var(--bad);
    text-align:center;
    min-height:14px;
  }
  .conn-error{
    position:fixed;
    top:0; left:0; right:0;
    background:#7A2E22;
    color:#fff;
    text-align:center;
    font-size:12px;
    padding:8px;
    z-index:100;
  }

  /* ---- bottom nav ---- */
  .bottom-nav{
    position:fixed;
    bottom:0; left:0; right:0;
    display:flex;
    justify-content:center;
    background:transparent;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    pointer-events:none;
  }
  .bottom-nav-inner{
    pointer-events:auto;
    width:100%;
    max-width:460px;
    background:var(--ink);
    border-radius:16px;
    display:flex;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
    overflow:hidden;
  }
  .nav-btn{
    flex:1;
    background:none;
    border:none;
    color:#C9C2B4;
    padding:10px 4px 8px;
    font-size:10px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
  }
  .nav-btn .nav-icon{ font-size:18px; line-height:1; }
  .nav-btn.active{ color:#fff; }
  .nav-btn.active .nav-icon{ transform:scale(1.1); }
</style>

<script>
const CATS = [
  { id:'grocery', name:'بقالة وسوبر ماركت', color:'var(--grocery)' },
  { id:'protein', name:'بروتين', color:'var(--meat)' },
  { id:'bathroom', name:'قسم المنظفات والحمام', color:'var(--toiletries)' },
  { id:'delivery', name:'طلبات دليفري', color:'var(--delivery)' },
];
const EXPENSE_CATS = CATS.concat([{ id:'other', name:'أخرى', color:'var(--other)' }]);
const PAYMENT_METHODS = ['كاش','فيزا/بطاقة','محفظة إلكترونية'];

const SUB_SUGGESTIONS = {
  grocery: ['بقالة جافة','معلبات ومشروبات','خضار وفاكهة','ألبان وبيض','حلويات ومقرمشات'],
  protein: ['لحوم','دواجن','أسماك'],
  bathroom: ['عناية شخصية','منظفات وغسيل'],
  delivery: ['مطاعم','كافيهات','تطبيقات توصيل'],
};

const DEFAULT_TOILETRIES = ['شامبو','شاور جل','مناديل تواليت','معجون أسنان'];
const ARABIC_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

const FAMILY_MEMBERS = [
  { name:'أشرف', role:'بابا' },
  { name:'مديحة', role:'ماما' },
  { name:'سلمى', role:'' },
  { name:'سارة', role:'' },
  { name:'ياسين', role:'' },
  { name:'محمد', role:'' },
];

const TABS = [
  { id:'home', icon:'🏠', label:'الرئيسية', title:'الرئيسية' },
  { id:'expenses', icon:'💰', label:'المصروفات', title:'المصروفات' },
  { id:'budget', icon:'📈', label:'الميزانية', title:'الميزانية' },
  { id:'shopping', icon:'🛒', label:'المشتريات', title:'قائمة المشتريات' },
  { id:'requests', icon:'🙋', label:'الطلبات', title:'طلبات البيت' },
];

let current = new Date();
current.setDate(1);
let state = null;
let activeTab = 'home';
let expPeriod = 'month'; // day | week | month
let myName = '';
let familyRequests = [];

function monthKey(d){ return 'household:' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function monthLabelText(d){ return ARABIC_MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
function toArabicNum(n){ return Number(n||0).toLocaleString('ar-EG', {maximumFractionDigits:2}); }
function todayStr(){ const t=new Date(); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); }
function isSameRealMonth(d){ const t=new Date(); return d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth(); }

let toastTimer=null;
function showToast(msg, ms){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), ms||2600);
}

/* ============================================================
   Supabase config — استبدل القيمتين دول بقيم مشروعك
   (Project Settings > API في لوحة تحكم Supabase)
   ============================================================ */
const SUPABASE_URL = 'PASTE_YOUR_SUPABASE_URL_HERE';
const SUPABASE_ANON_KEY = 'PASTE_YOUR_ANON_KEY_HERE';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function showConnError(msg){
  const el = document.getElementById('connError');
  if(!el) return;
  el.textContent = msg;
  el.style.display = 'block';
}
function hideConnError(){
  const el = document.getElementById('connError');
  if(el) el.style.display = 'none';
}

function defaultSalaryAlloc(){
  return [
    { id:crypto.randomUUID(), name:'مصروفات أساسية (إيجار - أكل - شرب)', percent:55 },
    { id:crypto.randomUUID(), name:'سداد ديون', percent:10 },
    { id:crypto.randomUUID(), name:'صدقات', percent:5 },
    { id:crypto.randomUUID(), name:'ادخار', percent:15 },
    { id:crypto.randomUUID(), name:'استثمار', percent:15 },
  ];
}

function emptyState(){
  const cats = {};
  CATS.forEach(c=>{
    cats[c.id] = c.id === 'bathroom'
      ? DEFAULT_TOILETRIES.map(n=>({id:crypto.randomUUID(), name:n, qty:1, price:0, bought:false, sub:'عناية شخصية'}))
      : [];
  });
  return { budget:'', cats, expenses:[], salary:'', salaryAlloc:defaultSalaryAlloc() };
}

function migrate(st){
  if(st.cats && st.cats.market){ st.cats.grocery = (st.cats.grocery||[]).concat(st.cats.market); delete st.cats.market; }
  if(st.cats && (st.cats.meat || st.cats.fish)){
    const meatItems=(st.cats.meat||[]).map(i=>({...i, sub:i.sub||'لحوم'}));
    const fishItems=(st.cats.fish||[]).map(i=>({...i, sub:i.sub||'أسماك'}));
    st.cats.protein=(st.cats.protein||[]).concat(meatItems, fishItems);
    delete st.cats.meat; delete st.cats.fish;
  }
  if(st.cats && (st.cats.toiletries || st.cats.cleaning)){
    const toiletItems=(st.cats.toiletries||[]).map(i=>({...i, sub:i.sub||'عناية شخصية'}));
    const cleaningItems=(st.cats.cleaning||[]).map(i=>({...i, sub:i.sub||'منظفات وغسيل'}));
    st.cats.bathroom=(st.cats.bathroom||[]).concat(toiletItems, cleaningItems);
    delete st.cats.toiletries; delete st.cats.cleaning;
  }
  CATS.forEach(c=>{
    if(!st.cats[c.id]) st.cats[c.id] = [];
    st.cats[c.id].forEach(i=>{ if(typeof i.sub==='undefined') i.sub=''; });
  });
  if(!st.expenses) st.expenses = [];
  if(typeof st.salary === 'undefined') st.salary = '';
  if(!st.salaryAlloc || !Array.isArray(st.salaryAlloc) || st.salaryAlloc.length===0) st.salaryAlloc = defaultSalaryAlloc();
  st.salaryAlloc.forEach(a=>{ if(!a.id) a.id = crypto.randomUUID(); });
  return st;
}

async function loadMonth(){
  const key = monthKey(current);
  document.getElementById('monthLabel').textContent = monthLabelText(current);
  try{
    const { data, error } = await sb.from('months').select('data').eq('month', key).maybeSingle();
    if(error) throw error;
    state = (data && data.data && Object.keys(data.data).length) ? migrate(data.data) : emptyState();
    hideConnError();
  }catch(e){
    state = emptyState();
    showConnError('تعذر تحميل بيانات الشهر ده — تأكد من الاتصال بالإنترنت.');
  }
  render();
}

let saveTimer=null;
function saveMonth(){
  clearTimeout(saveTimer);
  const key = monthKey(current);
  saveTimer = setTimeout(async ()=>{
    const snapshot = JSON.parse(JSON.stringify(state));
    try{
      const { error } = await sb.from('months').upsert({
        month:key, data:snapshot, updated_at:new Date().toISOString()
      });
      if(error) throw error;
      hideConnError();
    }catch(e){ showConnError('تعذر حفظ آخر تعديل — تأكد من الاتصال بالإنترنت.'); }
  }, 400);
}

async function loadFamilyRequests(){

let requestsChannel = null;
function subscribeFamilyRequests(){
  if(requestsChannel) return;
  requestsChannel = sb.channel('family_requests_live')
    .on('postgres_changes', { event:'*', schema:'public', table:'family_requests' }, async ()=>{

function catTotal(items){ return items.reduce((s,i)=> s+(Number(i.qty)||0)*(Number(i.price)||0), 0); }
function catBought(items){ return items.reduce((s,i)=> s+(i.bought?(Number(i.qty)||0)*(Number(i.price)||0):0), 0); }
function shoppingBoughtTotal(){ return CATS.reduce((s,c)=> s+catBought(state.cats[c.id]||[]), 0); }
function shoppingPendingCount(){ return CATS.reduce((s,c)=> s+(state.cats[c.id]||[]).filter(i=>!i.bought).length, 0); }
function expensesTotal(list){ return (list||state.expenses).reduce((s,e)=> s+(Number(e.amount)||0), 0); }
function actualSpentTotal(){ return shoppingBoughtTotal() + expensesTotal(); }
function catInfo(id){ return EXPENSE_CATS.find(c=>c.id===id) || EXPENSE_CATS[EXPENSE_CATS.length-1]; }

function periodFilter(list){
  const now = new Date();
  if(expPeriod==='day'){
    const t = todayStr();
    return list.filter(e=> e.date===t);
  }
  if(expPeriod==='week'){
    const d = new Date();
    const day = d.getDay(); // 0=Sun
    const start = new Date(d); start.setDate(d.getDate()-day); start.setHours(0,0,0,0);
    const end = new Date(start); end.setDate(start.getDate()+7);
    return list.filter(e=>{ const ed=new Date(e.date); return ed>=start && ed<end; });
  }
  return list; // month = everything in this month's state
}

      const calcRow = document.createElement('div');
      calcRow.className='item-calc-row';
      const qtyIn = document.createElement('input');
      qtyIn.type='number'; qtyIn.value=item.qty;
      const xSpan = document.createElement('span'); xSpan.textContent='×';
      const priceIn = document.createElement('input');
      priceIn.type='number'; priceIn.value=item.price;
      const eq = document.createElement('span'); eq.textContent='=';
      const total = document.createElement('span'); total.className='eq-total';
      total.textContent = toArabicNum((item.qty||0)*(item.price||0)) + ' ج.م';

      qtyIn.addEventListener('input', ()=>{
        item.qty = parseFloat(qtyIn.value)||0;
        total.textContent = toArabicNum((item.qty||0)*(item.price||0)) + ' ج.م';
        saveMonth();
        updateCatTotalsInline();
      });
      priceIn.addEventListener('input', ()=>{
        item.price = parseFloat(priceIn.value)||0;
        total.textContent = toArabicNum((item.qty||0)*(item.price||0)) + ' ج.م';
        saveMonth();
        updateCatTotalsInline();
      });

      calcRow.appendChild(qtyIn); calcRow.appendChild(xSpan); calcRow.appendChild(priceIn);
      calcRow.appendChild(eq); calcRow.appendChild(total);
      row.appendChild(calcRow);

      container.appendChild(row);
    };

    groups.forEach((groupItems, key)=>{
      if(hasNamedSubs && key!==''){
        const subHead=document.createElement('div');
        subHead.className='sub-head'; subHead.textContent=key;
        catEl.appendChild(subHead);
      }
      groupItems.forEach(item=> renderItem(item, catEl));
    });

    const addRow = document.createElement('div');
    addRow.className='add-row';
    const subOptions = [...new Set([...(SUB_SUGGESTIONS[cat.id]||[]), ...groups.keys()].filter(Boolean))];
    const listId = 'subs-'+cat.id;
    addRow.innerHTML = `
      <input class="name-in" type="text" placeholder="اسم الصنف">
      <input class="sub-in" type="text" placeholder="قسم فرعي (اختياري)" list="${listId}">
      <datalist id="${listId}">${subOptions.map(s=>`<option value="${s}"></option>`).join('')}</datalist>
      <input class="qty-in" type="number" placeholder="كمية" value="1">
      <input class="price-in" type="number" placeholder="سعر">
      <button>إضافة</button>
    `;
    const [nameIn, subIn, qtyIn, priceIn] = addRow.querySelectorAll('input');
    const addBtn = addRow.querySelector('button');
    const doAdd = ()=>{
      const nm = nameIn.value.trim();
      if(!nm){ nameIn.focus(); return; }
      const sub = subIn.value.trim();
      const qty = parseFloat(qtyIn.value)||1;
      const price = parseFloat(priceIn.value)||0;
      state.cats[cat.id].push({id:crypto.randomUUID(), name:nm, qty, price, bought:false, sub});
      saveMonth(); render();
    };
    addBtn.onclick = doAdd;
    [nameIn, subIn, qtyIn, priceIn].forEach(inp=> inp.addEventListener('keydown', e=>{ if(e.key==='Enter') doAdd(); }));
    catEl.appendChild(addRow);
    wrap.appendChild(catEl);
  });

  const grandTotal = CATS.reduce((s,c)=> s+catTotal(state.cats[c.id]||[]), 0);
  const grandBought = shoppingBoughtTotal();

  const foot = document.createElement('footer');
  foot.innerHTML = `
    <div class="dashed"></div>
    <div class="sum-row"><span>تم شراؤه فعلاً</span><span class="sum-val" id="sumBought">${toArabicNum(grandBought)} ج.م</span></div>
    <div class="sum-row total"><span>الإجمالي الكلي المخطط</span><span class="sum-val" id="sumGrand">${toArabicNum(grandTotal)} ج.م</span></div>
  `;
  wrap.appendChild(foot);

  const shareBtn = document.createElement('button');
  shareBtn.className='reset-link';
  shareBtn.textContent='مشاركة/نسخ القائمة';
  shareBtn.onclick = shareList;
  wrap.appendChild(shareBtn);

  const resetBtn = document.createElement('button');
  resetBtn.className='reset-link';
  resetBtn.textContent='تفريغ هذا الشهر';
  resetBtn.dataset.confirming='0';
  resetBtn.onclick = ()=>{
    if(resetBtn.dataset.confirming==='1'){
      clearTimeout(resetBtn._t);
      const keepExpenses = state.expenses;
      const keepBudget = state.budget;
      const keepSalary = state.salary;
      const keepAlloc = state.salaryAlloc;
      state = emptyState();
      state.expenses = keepExpenses;
      state.budget = keepBudget;
      state.salary = keepSalary;
      state.salaryAlloc = keepAlloc;
      saveMonth(); render();
      showToast('اتفرغت قائمة المشتريات للشهر ده.');
    } else {
      resetBtn.dataset.confirming='1';
      resetBtn.textContent='متأكد؟ دوس تاني عشان تفريغ 🗑';
      resetBtn._t = setTimeout(()=>{ resetBtn.dataset.confirming='0'; resetBtn.textContent='تفريغ هذا الشهر'; }, 4000);
    }
  };
  wrap.appendChild(resetBtn);
}

async function shareList(){
  let lines = ['قائمة البيت - '+monthLabelText(current), ''];
  let grand = 0;
  CATS.forEach(cat=>{
    const items = state.cats[cat.id]||[];
    if(items.length===0) return;
    lines.push(cat.name+':');
    const groups = new Map();
    items.forEach(i=>{ const key=i.sub||''; if(!groups.has(key)) groups.set(key,[]); groups.get(key).push(i); });
    groups.forEach((groupItems,key)=>{
      if(key) lines.push('  -- '+key+' --');
      groupItems.forEach(i=>{
        const subtotal=(Number(i.qty)||0)*(Number(i.price)||0);
        grand+=subtotal;
        const mark=i.bought?'✓':'•';
        lines.push(mark+' '+i.name+' — '+toArabicNum(i.qty)+'×'+toArabicNum(i.price)+' = '+toArabicNum(subtotal)+' ج.م');
      });
    });
    lines.push('');
  });
  lines.push('الإجمالي: '+toArabicNum(grand)+' ج.م');
  if(state.budget) lines.push('الميزانية: '+toArabicNum(state.budget)+' ج.م');
  const text = lines.join('\n');
  if(navigator.share){
    try{ await navigator.share({title:'قائمة البيت', text}); return; }catch(e){}
  }
  try{
    await navigator.clipboard.writeText(text);
    showToast('اتنسخت القائمة، تقدر تلزقها فين ما تحب.');
  }catch(e){
    const existing = document.getElementById('shareCopyBox');
    if(existing) existing.remove();
    const box = document.createElement('textarea');
    box.id = 'shareCopyBox';
    box.className = 'copy-box';
    box.readOnly = true;
    box.value = text;
    document.getElementById('tabContent').appendChild(box);
    box.focus(); box.select();
    showToast('النسخ التلقائي مش متاح — انسخ النص من الصندوق تحت يدوي.');
  }
}

function ensureName(){
  if(myName) return true;
  showToast('اختار مين حضرتك فوق الأول ✋');
  return false;
}

/* ---------------- FAMILY REQUESTS (shared across whoever opens this same link) ---------------- */
function renderRequests(wrap){
  const note = document.createElement('div');
  note.className='empty-hint';
  note.style.marginBottom='10px';
  note.textContent = 'الليست دي بتتحدث لحظياً لأي حد مسجّل دخول بنفس بيانات البيت، على أي جهاز.';
  wrap.appendChild(note);

  const nameCard = document.createElement('div');
  nameCard.className='card name-card';
  if(myName){
    nameCard.innerHTML = `<span>أنت: <strong>${myName}</strong></span>`;
    const change = document.createElement('button');
    change.textContent='تغيير';
    change.onclick = ()=>{ saveMyName(''); render(); };
    nameCard.appendChild(change);
    wrap.appendChild(nameCard);
  } else {
    nameCard.style.display='block';
    const label = document.createElement('div');
    label.className='card-label';
    label.style.marginBottom='8px';
    label.textContent='مين بيستخدم دلوقتي؟';
    nameCard.appendChild(label);

    const grid = document.createElement('div');
    grid.className='picker-grid';
    FAMILY_MEMBERS.forEach(m=>{
      const btn = document.createElement('button');
      btn.className='picker-btn';
      btn.innerHTML = `<span class="p-name">${m.name}</span>${m.role?`<span class="p-role">${m.role}</span>`:''}`;
      btn.onclick = ()=>{ saveMyName(m.name); render(); };
      grid.appendChild(btn);
    });
    nameCard.appendChild(grid);
    wrap.appendChild(nameCard);
  }

  const addRow = document.createElement('div');
  addRow.className='req-add-row';
  addRow.innerHTML = `<input type="text" id="reqText" placeholder="عايز إيه؟ مثلاً: هاتلي شاحن من الصيدلية">
    <button id="reqAddBtn">إضافة</button>`;
  wrap.appendChild(addRow);
  addRow.querySelector('#reqAddBtn').onclick = async ()=>{
    const ok = await ensureName();
    if(!ok) return;
    const txt = addRow.querySelector('#reqText').value.trim();
    if(!txt) return;
    addRow.querySelector('#reqText').value='';
    try{
      const { data, error } = await sb.from('family_requests').insert({
        name: myName, text: txt, status: 'pending', claimed_by: ''
      }).select().single();
      if(error) throw error;
      familyRequests.push({
        id:data.id, name:data.name, text:data.text, status:data.status,
        claimedBy:data.claimed_by, createdAt:new Date(data.created_at).getTime()
      });
      hideConnError();
    }catch(e){ showConnError('تعذر إضافة الطلب — تأكد من الاتصال.'); }
    render();
  };

  const refresh = document.createElement('button');
  refresh.className='refresh-link';
  refresh.textContent='🔄 تحديث القائمة (تجيب أحدث الطلبات من الكل)';
  refresh.onclick = async ()=>{ await loadFamilyRequests(); render(); };
  wrap.appendChild(refresh);

  const sorted = [...familyRequests].sort((a,b)=>{
    const order = {pending:0, claimed:1, done:2};
    if(order[a.status]!==order[b.status]) return order[a.status]-order[b.status];
    return (b.createdAt||0)-(a.createdAt||0);
  });

  if(sorted.length===0){
    const hint = document.createElement('div');
    hint.className='empty-hint';
    hint.textContent='مفيش طلبات دلوقتي';
    wrap.appendChild(hint);
    return;
  }

  sorted.forEach(r=>{
    const row = document.createElement('div');
    row.className='req-row'+(r.status==='done'?' done':'');
    const badgeText = r.status==='pending' ? 'لسه منتظر' : r.status==='claimed' ? ('مع '+r.claimedBy) : 'تم ✓';
    row.innerHTML = `
      <div class="req-top">
        <div>
          <div class="req-text">${r.text}</div>
          <div class="req-meta">🙋 ${r.name}</div>
        </div>
        <span class="badge ${r.status}">${badgeText}</span>
      </div>
    `;
    const actions = document.createElement('div');
    actions.className='req-actions';
    if(r.status==='pending'){
      const claim = document.createElement('button');
      claim.className='primary';
      claim.textContent='أنا جاي هجيبها';
      claim.onclick = async ()=>{
        const ok = await ensureName();
        if(!ok) return;
        r.status='claimed'; r.claimedBy=myName;
        try{
          const { error } = await sb.from('family_requests').update({ status:'claimed', claimed_by:myName }).eq('id', r.id);
          if(error) throw error;
          hideConnError();
        }catch(e){ showConnError('تعذر تحديث الطلب.'); }
        render();
      };
      actions.appendChild(claim);
    } else if(r.status==='claimed'){
      const done = document.createElement('button');
      done.className='primary';
      done.textContent='تم الإحضار ✓';
      done.onclick = async ()=>{
        r.status='done';
        try{
          const { error } = await sb.from('family_requests').update({ status:'done' }).eq('id', r.id);
          if(error) throw error;
          hideConnError();
        }catch(e){ showConnError('تعذر تحديث الطلب.'); }
        render();
      };
      actions.appendChild(done);
      const release = document.createElement('button');
      release.textContent='إلغاء';
      release.onclick = async ()=>{
        r.status='pending'; r.claimedBy='';
        try{
          const { error } = await sb.from('family_requests').update({ status:'pending', claimed_by:'' }).eq('id', r.id);
          if(error) throw error;
          hideConnError();
        }catch(e){ showConnError('تعذر تحديث الطلب.'); }
        render();
      };
      actions.appendChild(release);
    }
    const del = document.createElement('button');
    del.textContent='✕ حذف';
    del.onclick = async ()=>{
      familyRequests = familyRequests.filter(x=>x.id!==r.id);
      try{
        const { error } = await sb.from('family_requests').delete().eq('id', r.id);
        if(error) throw error;
        hideConnError();
      }catch(e){ showConnError('تعذر حذف الطلب.'); }
      render();
    };
    actions.appendChild(del);
    row.appendChild(actions);
    wrap.appendChild(row);
  });
}

document.getElementById('prevMonth').onclick = ()=>{ current.setMonth(current.getMonth()-1); loadMonth(); };
document.getElementById('nextMonth').onclick = ()=>{ current.setMonth(current.getMonth()+1); loadMonth(); };

/* ---------------- AUTH GATE ---------------- */
async function bootApp(){
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('app').style.display = '';
  loadMyName();
  await loadFamilyRequests();
  subscribeFamilyRequests();
  await loadMonth();
}

function showLogin(errMsg){
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginWrap').style.display = 'flex';
  const errEl = document.getElementById('loginError');
  errEl.textContent = errMsg || '';
}

document.getElementById('loginBtn').onclick = async ()=>{
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'اكتب الإيميل والباسورد.'; return; }
  try{
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ errEl.textContent = 'الإيميل أو الباسورد غلط.'; return; }
    await bootApp();
  }catch(e){
    errEl.textContent = 'تعذر الاتصال بالسيرفر — تأكد من إعداد SUPABASE_URL و SUPABASE_ANON_KEY في الكود.';
  }
};

document.getElementById('logoutLink').onclick = async ()=>{
  try{ await sb.auth.signOut(); }catch(e){}
  if(requestsChannel){ sb.removeChannel(requestsChannel); requestsChannel = null; }
  showLogin();
};

(async ()=>{
  try{
    const { data } = await sb.auth.getSession();
    if(data && data.session){
      await bootApp();
    } else {
      showLogin();
    }
  }catch(e){
    showLogin('تعذر الاتصال — تأكد من إعداد SUPABASE_URL و SUPABASE_ANON_KEY في أول الكود.');
  }
})();
</script>
